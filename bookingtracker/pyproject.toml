[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bookingtracker"
version = "0.1.0"
description = "Exact Booking.com reservation price tracker"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "jinja2>=3.1,<4",
  "playwright>=1.48,<2",
  "pydantic>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "tests"]
extend-exclude = ["app/browser"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
