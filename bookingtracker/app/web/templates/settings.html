{% extends "base.html" %}{% block content %}<h1>Notification settings</h1>{% if error %}<p class="error">{{ error }}</p>{% endif %}<form method="post" action="{{ url('update_settings') }}"><input type="hidden" name="csrf_token" value="{{ csrf }}"><label>Minimum price drop (%)<input name="price_drop_threshold_percent" value="{{ settings.get_price_drop_threshold() }}"></label><label>Home Assistant notify entity<input name="home_assistant_notify_entity" value="{{ settings.get_notify_entity() or '' }}" placeholder="notify.telegram_bot_roman"></label><p>Home Assistant owns notifier secrets.</p><button>Save settings</button></form>{% endblock %}
